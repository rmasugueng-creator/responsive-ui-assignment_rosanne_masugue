<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive UI Assignment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header role="banner">
        <h1>My Contact Manager</h1>
        <input type="text" id="search-input" placeholder="Search by name...">
    </header>

    <main role="main">
        <!-- FORMULAIRE -->
        <section>
            <h2>Add Contact</h2>
            <form id="contact-form">
                <input type="hidden" id="contact-id">
                
                <label for="full-name">Name:</label>
                <input type="text" id="full-name" required>
                <p id="name-error" style="color:red;"></p>

                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <p id="email-error" style="color:red;"></p>

                <label for="phone">Phone (10 digits):</label>
                <input type="tel" id="phone" required>
                <p id="phone-error" style="color:red;"></p>

                <label for="security-key">Key (6+ chars, 1 Upper, 1 Number):</label>
                <input type="text" id="security-key" required>
                <p id="security-error" style="color:red;"></p>

                <button type="submit" id="submit-btn">Save</button>
            </form>
        </section>

        <!-- LISTE ET ACTIONS -->
        <section>
            <h2>Contact List</h2>
            <div style="margin-bottom: 10px;">
                <button id="sort-btn">Sort A-Z</button>
                <button id="export-btn">Export JSON</button>
                <input type="file" id="import-file" accept=".json">
            </div>

            <table id="contacts-table" border="1" style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Key</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contacts-body"></tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
